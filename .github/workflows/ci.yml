name: Smart Agriculture CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker Image
        run: |
          docker build -t smart-agriculture-backend:v1 ./backend
          
              - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
                - name: Tag Docker Image
        run: |
          docker tag smart-agriculture-backend:v1 leadsamit/smart-agriculture-backend:v1

      - name: Push Docker Image
        run: |
          docker push leadsamit/smart-agriculture-backend:v1